spring.application.name=portback

# DB Settings
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:portfolio;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Admin
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin1234}

# File Upload
upload.dir=${UPLOAD_DIR:/Users/hwangseongjun/dev/portfolio/portback/uploads}

# JWT (secret must be at least 32 chars)
jwt.secret=${JWT_SECRET:portfolio-admin-secret-key-2024-must-be-long-enough}
jwt.expiration=86400000
